# Krempelair – Konfiguration (/etc/krempelair/config.ini)
# Fehlende Werte nehmen den Standard aus krempelair/config.py.
# Nach Änderungen: sudo systemctl restart krempelair-control krempelair-bot krempelair-web

[general]
db_path = /var/lib/krempelair/krempelair.db
state_path = /run/krempelair/state.json
# Verlauf: ein Messpunkt pro Minute, 400 Tage aufbewahren
history_seconds = 60
retention_days = 400

[hardware]
i2c_bus = 1
simulate = false

[control]
# pid = neue Regelung, legacy = Rechenweg des Altsystems (Rückfall)
algorithm = pid
cycle_seconds = 2
# PID-Parameter aus dem Sprungversuch vom 21.10.2026, siehe docs/regelung.md
kp = 0.7
ti = 120
td = 0
# Anlagenmodell für die Aufteilung WRG → Heizregister
hx_efficiency = 0.5
heater_rise_stage1 = 11
heater_rise_stage2 = 8.6
max_rate_per_s = 5
# Stellwerte 0…1023 bei stehender Anlage, Frost, fehlenden Messwerten
off_wrg = 1023
# Heizventil bei stehender Anlage: zu, unter off_cold_on °C aussen (Witterung)
# offen gegen Frost, bis es wieder über off_cold_off °C hat
off_le = 0
off_le_cold = 900
off_cold_on = 3
off_cold_off = 5
frost_wrg = 1023
frost_le = 900
safe_wrg = 1023
safe_le = 900
# Lüftung nach so vielen Stunden ununterbrochenem Lauf ausschalten (0 = nie)
max_run_hours = 36

[nak]
# Nachtauskühlung, per Telegram jeweils für duration_hours aktiviert
duration_hours = 48
# optionales Zeitfenster, leer = nur nach Temperaturen
window_start =
window_end =
inside_sensor = t_raum
outside_sensor = t_witt
start_margin = 1.0
start_delta = 3.0
stop_delta = 1.0
min_outside = 10
fan_level = 2
min_run_minutes = 15
min_pause_minutes = 15
default_target = 20

[web]
# öffentliches Dashboard, nur lesend (auch über krempel.maurizi.ch)
host = 0.0.0.0
port = 80

[panel]
# Bedienung mit Anmeldung, nur aus dem LAN (nie über den Rückkanal weiterleiten)
host = 0.0.0.0
port = 8080
session_hours = 8

[telegram]
poll_timeout = 50
max_login_failures = 5
lockout_minutes = 15
